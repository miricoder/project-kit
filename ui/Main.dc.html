<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6A86}a:hover{color:#154C60}
[style*="flex-grow: 1"],.item > span{min-width:0;overflow-wrap:anywhere}
.act{max-width:100%;white-space:normal}
:focus-visible{outline:3px solid #1E6A86;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.plain{list-style:none;margin:0;padding:0}
.cap{border:1px solid #858E95}
.cap:focus-within{border-color:#1E6A86;box-shadow:0 0 0 2px #1E6A86}
.cap input{outline:none}
.cap input::placeholder{color:#5B636B}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:2px solid #858E95;border-radius:6px;background:#FFFFFF;display:grid;place-content:center;flex-shrink:0;cursor:pointer}
.chk.warn{border-color:#A84B0C}
.chk:checked{background:#1E6A86;border-color:#1E6A86}
.chk:checked::after{content:"";width:10px;height:5px;border-left:2.5px solid #FFFFFF;border-bottom:2.5px solid #FFFFFF;transform:rotate(-45deg) translate(1px,-1px)}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; background: #F5F6F4; font-family: Manrope, system-ui, sans-serif; color: #15181C">
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 8px">
<div style="font-size: 13px; font-weight: 600; color: #5B636B">Wednesday 25 February</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Here’s where things stand</h1>
</div>

<section aria-labelledby="due-h" style="background: #FFFFFF; border: 1px solid #E3E6E3; border-radius: 16px; padding: 8px 16px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px">
<h2 id="due-h" style="margin: 0; font-size: 15px; font-weight: 700">Due soon</h2>
<span style="font-size: 12px; font-weight: 600; color: #5B636B">3 tasks</span>
</div>
<ul class="plain">
<li><label style="display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer">
<input type="checkbox" class="chk warn">
<span style="display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Check passport expiry</span>
<span style="font-size: 12px; color: #A84B0C; font-weight: 700">Due today · for Lisbon</span>
</span>
</label></li>
<li><label style="display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer">
<input type="checkbox" class="chk">
<span style="display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Dentist</span>
<span style="font-size: 12px; color: #5B636B">Fri 27 Feb, 15:00 · moved from Thu</span>
</span>
</label></li>
<li><label style="display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer">
<input type="checkbox" class="chk">
<span style="display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Pay car insurance</span>
<span style="font-size: 12px; color: #5B636B">Sat 28 Feb</span>
</span>
</label></li>
</ul>
</section>

<section aria-labelledby="budget-h" style="background: #FFFFFF; border: 1px solid #E3E6E3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="budget-h" style="margin: 0; font-size: 15px; font-weight: 700">February budget</h2>
<span style="font-size: 12px; font-weight: 600; color: #5B636B">€1,400</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">€488</span>
<span style="font-size: 13px; color: #5B636B">left · €912 spent</span>
</div>
<div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E3E6E3; overflow: hidden"><div style="width: 65%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: #5B636B">
<div style="display: flex; flex-direction: column"><dt>Groceries</dt><dd style="margin: 0; font-size: 14px; font-weight: 700; color: #15181C">€318</dd></div>
<div style="display: flex; flex-direction: column"><dt>Eating out</dt><dd style="margin: 0; font-size: 14px; font-weight: 700; color: #15181C">€146</dd></div>
<div style="display: flex; flex-direction: column"><dt>Transport</dt><dd style="margin: 0; font-size: 14px; font-weight: 700; color: #15181C">€92</dd></div>
</dl>
</section>

<a href="Trip.dc.html" aria-label="Lisbon trip, 13 to 16 March: €386 left of €600. Next: ask Sam about cat feeding by 5 March." style="text-decoration: none; color: inherit; background: #FFFFFF; border: 1px solid #E3E6E3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6A86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>
<span style="font-size: 15px; font-weight: 700">Lisbon</span>
</div>
<span style="font-size: 12px; font-weight: 600; color: #5B636B">13–16 Mar · in 16 days</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 22px; font-weight: 700">€386</span>
<span style="font-size: 13px; color: #5B636B">left of €600 · €214 spent</span>
</div>
<div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E3E6E3; overflow: hidden"><div style="width: 36%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
<div style="font-size: 13px; color: #5B636B">Next: <span style="color: #15181C; font-weight: 600">Ask Sam about cat feeding</span> · 5 Mar</div>
</a>

<form class="cap" style="margin-top: auto; background: #FFFFFF; border-radius: 22px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgba(21,24,28,0.06)">
<label for="cap" class="sr">Tell it anything</label>
<input id="cap" placeholder="Tell me anything… “paid 42 for groceries”" style="flex-grow: 1; min-width: 0; height: 44px; border: none; font: inherit; font-size: 15px; color: #15181C; background: transparent">
<button type="button" aria-label="Paste notes" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; border: none; background: #EEF0EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
</button>
<button type="button" aria-label="Dictate" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><path d="M12 17v4"></path></svg>
</button>
</form>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E6A86","options":["#1E6A86","#3D5A80","#2F6B4F","#8A4B2D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1E6A86' };
}
}
</script>
</body>
</html>
