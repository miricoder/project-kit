name: Dumpit CI

# Every push and pull request: run every test, and build the container image.
# Every push to the app's branch, once Google Cloud is set up: deploy to staging.
# A v* tag (pk ship release, which only you can push): deploy to production.
# Deploys need the four repository variables printed by scripts/setup-cloud.sh; until they
# exist the deploy jobs are skipped and CI stays green. No secret is stored in GitHub.
on:
  push:
    branches: [dumpit, main]
    tags: ['v*']
  pull_request:
    branches: [dumpit, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUMPIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Playwright and Chromium for the browser tests
        run: |
          npm install -g playwright@1.49.1
          npx -y playwright@1.49.1 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Run every test
        run: sh scripts/test.sh

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build the image (not pushed)
        run: docker build --build-arg APP_VERSION="$(sh scripts/version.sh)" -t dumpit:ci .
      - name: The image carries its version, its changelog and the web app
        run: |
          docker run --rm --entrypoint sh dumpit:ci -c \
            'test -f web/dist/index.html && grep -rlq "$APP_VERSION" web/dist/assets'
          docker run --rm --entrypoint python dumpit:ci -c \
            "from service.versions import current_version, read_changelog, CHANGELOG; v=current_version(); assert v != 'dev', v; assert read_changelog(CHANGELOG); print('version', v)"

  deploy-staging:
    needs: [test, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to staging
        run: sh scripts/deploy.sh staging

  deploy-production:
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/v') && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to production
        run: sh scripts/deploy.sh production
