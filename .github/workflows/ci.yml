name: Dumpit CI

# Runs every Dumpit test on each push to the dumpit branch and on pull requests into it:
# Python (service, filer, eval) against a Postgres service, the web app's unit tests, and
# the browser tests against a built app. No secrets: the tests use the demo filer.
on:
  push:
    branches: [dumpit]
  pull_request:
    branches: [dumpit]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUMPIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright and Chromium for the browser tests
        run: |
          npm install -g playwright@1.49.1
          npx -y playwright@1.49.1 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Run every test
        run: sh scripts/test.sh
